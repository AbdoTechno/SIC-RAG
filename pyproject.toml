[project]
name = "rag-engine"
version = "0.1.0"
description = "rag engine reusable pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.3.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["rag_engine"]
testpaths = ["tests"]
addopts = "-v"
